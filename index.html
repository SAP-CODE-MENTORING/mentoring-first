<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP CODE 멘토링</title>
<style>
  html,
  body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: #fbfcfd;
    color: #1b2330;
  }

  /* ----- 상단 바 ----- */
  .pager {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    align-items: center;
    justify-content: center;
    padding: .55rem 1rem;
    background: #fff;
    border-bottom: 1px solid #dde3ea;
    font-size: .9rem;
  }
  .pager .title {
    margin-right: auto;
    font-weight: 700;
    color: inherit;
    text-decoration: none;
  }
  .pager .title:hover {
    color: #2357a8;
  }
  .pager .nav {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    align-items: center;
  }
  .pager button {
    padding: .3rem .75rem;
    border: 1px solid #dde3ea;
    border-radius: 999px;
    background: #fff;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .pager button:hover:not(:disabled) {
    background: #e9f0fb;
  }
  .pager button.on {
    background: #2357a8;
    border-color: #2357a8;
    color: #fff;
    font-weight: 700;
  }
  .pager button:disabled {
    opacity: .35;
    cursor: default;
  }
  .mentor {
    padding: .25rem .7rem;
    border: 1px solid #e0b84c;
    border-radius: 999px;
    background: #fff6dc;
    color: #7a5a00;
    font-size: .8rem;
  }

  /* ----- 첫 화면 ----- */
  #home {
    flex: 1;
    overflow: auto;
  }
  .home-in {
    max-width: 56rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 3rem;
  }
  .home-in .eyebrow {
    margin: 0;
    color: #2357a8;
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .home-in h1 {
    margin: .3rem 0 .5rem;
    font-size: 1.9rem;
  }
  .home-in .lead {
    margin: 0 0 1.8rem;
    color: #5a6574;
    line-height: 1.7;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: .9rem;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: .45rem;
    padding: 1rem 1.1rem;
    border: 1px solid #dde3ea;
    border-radius: 14px;
    background: #fff;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .card:hover:not(:disabled) {
    border-color: #2357a8;
    box-shadow: 0 2px 10px rgba(35, 87, 168, .12);
  }
  .card:focus-visible {
    outline: 2px solid #2357a8;
    outline-offset: 2px;
  }
  /* 열린 주차: 왼쪽 파란 띠 */
  .card.open {
    border-left: 5px solid #2357a8;
  }
  /* 이번 주: 파란 배경 + 진한 테두리 */
  .card.now {
    border: 2px solid #2357a8;
    border-left-width: 5px;
    background: #f0f5fd;
  }
  /* 잠긴 주차·준비 중: 회색 점선, 흐리게 */
  .card:disabled {
    cursor: default;
    border-style: dashed;
    background: #eef1f4;
  }
  .card:disabled .card-week,
  .card:disabled .card-date {
    color: #8a94a3;
  }
  .card-go {
    margin-top: auto;
    color: #2357a8;
    font-size: .85rem;
    font-weight: 700;
  }
  .card-top {
    display: flex;
    align-items: baseline;
    gap: .5rem;
  }
  .card-week {
    font-size: 1.25rem;
    font-weight: 700;
  }
  .card-date {
    color: #5a6574;
    font-size: .85rem;
  }
  .card-title {
    min-height: 2.6em;
    line-height: 1.45;
  }
  .card:disabled .card-title {
    color: #8a94a3;
  }
  .chip {
    align-self: flex-start;
    padding: .15rem .6rem;
    border-radius: 999px;
    font-size: .78rem;
    font-weight: 700;
    background: #e9f0fb;
    color: #2357a8;
  }
  .chip.now {
    background: #2357a8;
    color: #fff;
  }
  .chip.lock {
    background: #dfe3e8;
    color: #5a6574;
  }


  /* ----- 주차 보기 ----- */
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
  }
  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>
<nav class="pager">
  <a class="title" id="team" href="#">SAP CODE 멘토링</a>
  <span class="nav" id="nav" hidden>
    <button id="prev" type="button">‹ 이전</button>
    <span id="pages"></span>
    <button id="next" type="button">다음 ›</button>
  </span>
</nav>

<section id="home">
  <div class="home-in">
    <p class="eyebrow" id="home-eyebrow"></p>
    <h1>주차별 멘토링 자료</h1>
    <p class="lead">매주 목요일 멘토링 날 0시에 그 주 자료가 열려요. 보고 싶은 주차를 누르세요.</p>
    <div class="cards" id="cards"></div>
  </div>
</section>

<iframe id="view" title="주차별 멘토링" hidden></iframe>

<script src="weeks.js"></script>
<script>
  (function () {
    var M = window.MENTORING;
    var PREFIX = M.prefix;
    var MAX_WEEK = M.maxWeek;

    var home = document.getElementById('home');
    var view = document.getElementById('view');
    var nav = document.getElementById('nav');
    var cards = document.getElementById('cards');
    var pages = document.getElementById('pages');
    var prevBtn = document.getElementById('prev');
    var nextBtn = document.getElementById('next');

    var available = []; // 열려 있고 파일도 있는 주차 (오름차순)
    var current = 0;

    document.getElementById('team').textContent = M.team;
    document.getElementById('home-eyebrow').textContent = M.team;

    if (M.isPreview()) {
      var badge = document.createElement('span');
      badge.className = 'mentor';
      badge.title = '공개 전 주차도 보이는 상태 · ?preview=off 로 해제';
      badge.textContent = '멘토 모드';
      document.querySelector('.pager').appendChild(badge);
    }

    function exists(n) {
      if (!M.isOpen(n)) {
        return Promise.resolve(false); // 공개 전 주차는 파일이 있어도 잠금
      }
      return fetch(PREFIX + n + '.html', { method: 'HEAD', cache: 'no-store' })
        .then(function (r) {
          return r.ok;
        })
        .catch(function () {
          return false;
        });
    }

    // ----- 첫 화면 카드 -----
    function renderCards() {
      // '이번 주' = 실제로 공개된 주차 중 가장 최근 (멘토 모드여도 날짜 기준)
      var latest = 0;
      for (var k = 0; k < available.length; k++) {
        if (M.isReleased(available[k])) latest = available[k];
      }
      var html = '';
      for (var n = 1; n <= MAX_WEEK; n++) {
        var has = available.indexOf(n) !== -1;
        var title = M.title(n) || '준비 중';
        var chip, cls;
        if (!M.isOpen(n)) {
          chip = '<span class="chip lock">🔒 ' + M.openLabel(n) + ' 오픈</span>';
          cls = 'locked';
        } else if (!has) {
          chip = '<span class="chip lock">준비 중</span>';
          cls = 'locked';
        } else if (!M.isReleased(n)) {
          chip = '<span class="chip">멘토 미리보기 · ' + M.openLabel(n) + ' 오픈</span>';
          cls = 'open';
        } else if (n === latest) {
          chip = '<span class="chip now">이번 주</span>';
          cls = 'open now';
        } else {
          chip = '<span class="chip">지난 주차</span>';
          cls = 'open';
        }
        html += '<button type="button" class="card ' + cls + '" data-week="' + n + '"' +
          (has ? '' : ' disabled') + '>' +
          '<span class="card-top"><span class="card-week">' + n + '주차</span>' +
          '<span class="card-date">' + M.openLabelLong(n) + '</span></span>' +
          '<span class="card-title">' + title + '</span>' + chip +
          (has ? '<span class="card-go">자료 보기 ›</span>' : '') + '</button>';
      }
      cards.innerHTML = html;
    }

    // ----- 상단 주차 버튼 -----
    function renderPager() {
      var html = '';
      for (var n = 1; n <= MAX_WEEK; n++) {
        var has = available.indexOf(n) !== -1;
        var text = M.isOpen(n) ? n + '주차' : '🔒 ' + n + '주차';
        html += '<button type="button" data-week="' + n + '"' +
          (n === current ? ' class="on"' : '') +
          (has ? '' : ' disabled') +
          (M.isOpen(n) ? '' : ' title="' + M.openLabel(n) + ' 오픈"') +
          '>' + text + '</button> ';
      }
      pages.innerHTML = html;

      var idx = available.indexOf(current);
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx === -1 || idx >= available.length - 1;
    }

    function showHome() {
      current = 0;
      home.hidden = false;
      view.hidden = true;
      nav.hidden = true;
      view.removeAttribute('src');
      document.title = M.team;
      renderCards();
    }

    function showWeek(n) {
      current = n;
      home.hidden = true;
      view.hidden = false;
      nav.hidden = false;
      view.src = PREFIX + n + '.html';
      document.title = n + '주차 · ' + M.team;
      renderPager();
    }

    // 주소의 #N 으로 화면을 정함 (#N이 없거나 열 수 없는 주차면 첫 화면)
    function route() {
      var n = parseInt(location.hash.slice(1), 10);
      if (available.indexOf(n) !== -1) {
        showWeek(n);
      } else {
        showHome();
      }
    }

    function go(n) {
      if (available.indexOf(n) === -1) return;
      location.hash = '#' + n; // hashchange → route()
    }

    cards.addEventListener('click', function (e) {
      var card = e.target.closest('.card');
      if (card && !card.disabled) go(parseInt(card.getAttribute('data-week'), 10));
    });
    pages.addEventListener('click', function (e) {
      var w = e.target.getAttribute('data-week');
      if (w) go(parseInt(w, 10));
    });
    prevBtn.addEventListener('click', function () {
      go(available[available.indexOf(current) - 1]);
    });
    nextBtn.addEventListener('click', function () {
      go(available[available.indexOf(current) + 1]);
    });
    window.addEventListener('hashchange', route);

    var checks = [];
    for (var i = 1; i <= MAX_WEEK; i++) {
      checks.push(exists(i));
    }

    Promise.all(checks).then(function (ok) {
      for (var n = 1; n <= MAX_WEEK; n++) {
        if (ok[n - 1]) available.push(n);
      }
      route();
    });
  })();
</script>
</body>
</html>
